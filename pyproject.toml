[project]
name = "governor"
version = "0.0.1"
description = "governor: an agentic data platform on one foundation (core + ask)"
requires-python = ">=3.12"
dependencies = [           # G1 adds the foundation deps; later steps add theirs (each with a reason in NOTES)
    "dbt-core~=1.12",
    "dbt-duckdb~=1.11",
    "duckdb",
    "pyyaml",
    "pydantic",
    "faker",
    "langchain~=1.4",
    "langchain-openai",
    "rank-bm25",
    "numpy",
    "sqlglot",
    "langgraph-checkpoint-sqlite",
    "fastapi",
    "uvicorn",
    "httpx",
    "streamlit",
    "mcp>=1.10,<2",
    "psycopg[binary]",
    "dbt-postgres",
    "slack-bolt>=1.21",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
