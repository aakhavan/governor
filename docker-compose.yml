# Local stack: the API and (from G8) the Streamlit UI. Secrets come from .env
# (never committed; copy .env.example). See docs/deploy.md.
services:
  api:
    build: .
    image: governor:local
    env_file: .env
    environment:
      GOVERNOR_STATE_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - governor-data:/data
    restart: unless-stopped

  ui:
    # Streamlit thin client: talks to the api service over HTTP only. Users paste
    # their own token in the UI, so this service gets no secrets (no env_file).
    image: governor:local
    environment:
      GOVERNOR_API_URL: http://api:8000
    command:
      - streamlit
      - run
      - apps/streamlit/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  governor-data:
