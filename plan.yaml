# governor-ask on the shared foundation. Spec: PLAN.md (§7 steps). Locked with `factory lock`.
# Capstone batch 1 (C1-C6) added 2 Nov 2026: contracts in docs/capstone/design.md, vocabulary in CONTEXT.md, decisions in docs/adr/.
# Revised 22 Oct after the Sol review: G2/G5/G6/G10 split, G7 API/auth/deploy added, MCP (G9) is a stretch.
project: governor
notes: NOTES.md
agents: AGENTS.md
defaults:
  max_fix_loops: 2
  timeout_min: 60
  run_budget_usd: 80          # notional on subscriptions (Opus implementing); a safety cap per `factory run`
  step_budget_usd: 25
  review_budget_usd: {design: 2.0, mechanical: 0.75}
# no `roles`: the design / mechanical lists come from %USERPROFILE%\.factory\agents.yaml
steps:
  - id: G1
    title: Foundation from the Sprint 4 import (core package, green build, fct_invoices, metadata store)
    tier: mechanical
    prompt: plan/prompts/G1.md
    accept: plan/accept/accept_g1.py
    allowed_paths: [src/governor/__init__.py, src/governor/core/, fixture/, knowledge/owners.yaml, knowledge/policy.yaml, tests/core/, tests/conftest.py, pyproject.toml, uv.lock, PROVENANCE.md, .gitignore]
    human_gate: false
    review_focus: "imported code keeps provenance and changes are listed; no Sprint 4 or absolute paths; fct_invoices pins time to as_of, never now(); access.yaml untouched (human-owned); mart PII tags really propagate"
  - id: G2a
    title: Metric definitions, golden-set loader, result checker
    tier: design
    prompt: plan/prompts/G2a.md
    accept: plan/accept/accept_g2a.py
    allowed_paths: [knowledge/metrics.yaml, src/governor/eval/, tests/eval/, pyproject.toml, uv.lock]
    human_gate: false
    review_focus: "metric SQL matches its written definition (grain, filters, what counts as active/churned/overdue); checker cannot call a wrong result equal (rubric Q1, Q7)"
  - id: G2b
    title: Golden set with gold SQL, frozen split, review table
    tier: design
    prompt: plan/prompts/G2b.md
    accept: plan/accept/accept_g2b.py
    allowed_paths: [evaluation/golden/, src/governor/eval/golden.py, tests/eval/]
    human_gate: true
    review_focus: "gold SQL answers the question as worded (grain, filters, as_of-relative dates); categories are unambiguous; ambiguous questions really lack a slot; policy expectations follow access.yaml (rubric Q1, Q6, Q7)"
  - id: G3
    title: Evaluation harness, metrics, self-test systems, baseline
    tier: design
    prompt: plan/prompts/G3.md
    accept: plan/accept/accept_g3.py
    allowed_paths: [src/governor/eval/, src/governor/ask/__init__.py, src/governor/ask/baseline.py, src/governor/ask/prompts/baseline.md, src/governor/ask/llm_testing.py, tests/eval/, tests/ask/, tests/core/, fixture/AS_OF, fixture/build_green.py, fixture/load_raw.py, pyproject.toml, uv.lock]
    human_gate: false
    review_focus: "as_of is pinned in fixture/AS_OF and a rebuild reproduces it and the marts; a naive system cannot score well (oracle/null/leaky behave as specified); PII leak detection uses column lineage plus value scan; holdout guard works; the baseline really has no retrieval or validator (rubric Q1, Q2)"
  - id: G4
    title: Catalog and metric cards, hybrid schema retrieval, recall@k on gold tables
    tier: mechanical
    prompt: plan/prompts/G4.md
    accept: plan/accept/accept_g4.py
    allowed_paths: [src/governor/ask/catalog.py, src/governor/ask/retrieval.py, src/governor/core/retrieval.py, tests/ask/, pyproject.toml, uv.lock]
    human_gate: false
    review_focus: "cards are built from meta.duckdb and metrics.yaml, not hand-written; cards contain no golden questions or gold SQL; recall is computed from gold SQL tables, not from the question text (rubric Q2, Q5)"
  - id: G5a
    title: SQL validator and role policy
    tier: design
    prompt: plan/prompts/G5a.md
    accept: plan/accept/accept_g5a.py
    allowed_paths: [src/governor/ask/validator.py, src/governor/ask/policy.py, tests/ask/, pyproject.toml, uv.lock]
    human_gate: false
    review_focus: "every locked case rejected for the right reason; default-deny relations and table functions; PII followed through aliases, CTEs, subqueries, functions; masking is an outer projection; no policy values copied from access.yaml into code"
  - id: G5b
    title: Dry-run and read-only executor
    tier: design
    prompt: plan/prompts/G5b.md
    accept: plan/accept/accept_g5b.py
    allowed_paths: [src/governor/ask/executor.py, src/governor/ask/validator.py, src/governor/core/warehouse.py, tests/ask/, pyproject.toml, uv.lock]
    human_gate: true
    review_focus: "executed results match the locked cases; the connection is read-only with external access off even if the validator is wrong; masking keeps DISTINCT/GROUP BY semantics; timeouts really interrupt"
  - id: G6a
    title: The governor-ask graph (core, in-memory)
    tier: design
    prompt: plan/prompts/G6a.md
    accept: plan/accept/accept_g6a.py
    allowed_paths: [src/governor/ask/, tests/ask/, pyproject.toml, uv.lock]
    human_gate: false
    review_focus: "code owns the edges; every data value in the answer comes from result rows; refusals never echo input; relative dates become literals from as_of; prompts contain no golden questions (rubric Q2, Q4, Q8)"
  - id: G6b
    title: Persistence, decision traces, CLI and the agent system
    tier: design
    prompt: plan/prompts/G6b.md
    accept: plan/accept/accept_g6b.py
    allowed_paths: [src/governor/ask/, src/governor/eval/systems.py, src/governor/core/paths.py, src/governor/core/trace.py, tests/ask/, tests/eval/, pyproject.toml, uv.lock]
    human_gate: false
    review_focus: "trace rows complete and free of raw PII; resume works across processes; the agent system reports clarify as clarify, never auto-answers; state dir is configurable"
  - id: G7
    title: API, authentication and deployment skeleton
    tier: design
    prompt: plan/prompts/G7.md
    accept: plan/accept/accept_g7.py
    allowed_paths: [src/governor/api/, src/governor/ask/service.py, tests/api/, Dockerfile, docker-compose.yml, .dockerignore, .env.example, .gitignore, docs/deploy.md, pyproject.toml, uv.lock]
    human_gate: true
    review_focus: "role derived only from the token; no role in request bodies; threads and traces scoped to the role; tokens never logged or committed; errors carry no tracebacks; image builds the warehouse read-only and runs as non-root"
  - id: G8
    title: Streamlit as a thin client over the API
    tier: mechanical
    prompt: plan/prompts/G8.md
    accept: plan/accept/accept_g8.py
    allowed_paths: [apps/streamlit/, tests/ui/, docker-compose.yml, pyproject.toml, uv.lock]
    human_gate: false
    review_focus: "pages talk to the API only; no role picker; a rerun keeps a pending clarification; the result table is shown, not only text"
  - id: G9
    title: "MCP server with 5 read-only tools (stretch: cut first if late)"
    tier: mechanical
    prompt: plan/prompts/G9.md
    accept: plan/accept/accept_g9.py
    allowed_paths: [src/governor/ask/mcp_server.py, src/governor/ask/service.py, tests/mcp/, docs/mcp.md, pyproject.toml, uv.lock]
    human_gate: false
    review_focus: "tools reuse the validator and executor (no second policy path); role fixed by env, never a tool argument; no write path; tool descriptions do not leak policy internals"
  - id: G10a
    title: Tune on the tune split, then freeze the prompts
    tier: design
    prompt: plan/prompts/G10a.md
    accept: plan/accept/accept_g10a.py
    allowed_paths: [src/governor/ask/, src/governor/eval/, evaluation/reports/, tests/]
    human_gate: false
    review_focus: "changes are justified by tune failures, not by reading golden items; no holdout run; frozen hashes match; tuning notes honest (rubric Q6)"
  - id: G10b
    title: Holdout once, eval report, README, demo script
    tier: design
    prompt: plan/prompts/G10b.md
    accept: plan/accept/accept_g10b.py
    allowed_paths: [src/governor/eval/, evaluation/reports/, evaluation/eval_report.md, evaluation/holdout_runs.log, README.md, docs/, tests/eval/]
    human_gate: true
    review_focus: "holdout run once after the freeze; numbers in README equal the report; limits stated honestly (small catalog, single warehouse, 15 holdout items); agent vs baseline per category; no PII leak (rubric Q6, Q8)"
  - id: C1
    title: Close the four G-phase follow-ups (checkpoint privacy, OpenAPI, dry-run timeout, Docker check)
    tier: design
    prompt: plan/prompts/C1.md
    accept: plan/accept/accept_c1.py
    allowed_paths: [src/governor/ask/run.py, src/governor/ask/service.py, src/governor/ask/graph.py, src/governor/ask/executor.py, src/governor/ask/checkpoints.py, src/governor/api/app.py, tests/, Dockerfile, docs/deploy.md, fixture/build_green.py]
    human_gate: false
    review_focus: "deleted checkpoints are gone from disk (secure_delete or vacuum), not only from queries; paused clarify threads still resume; no change to ask's prompts or answers; OpenAPI off unless GOVERNOR_API_DOCS=1; dry_run uses the same timeout path as run_readonly"
  - id: C2
    title: Warehouse adapter seam, DuckDB first, no behaviour change
    tier: design
    prompt: plan/prompts/C2.md
    accept: plan/accept/accept_c2.py
    allowed_paths: [src/governor/core/adapters/, src/governor/core/warehouse.py, src/governor/core/config.py, src/governor/ask/executor.py, src/governor/ask/validator.py, src/governor/ask/service.py, src/governor/ask/graph.py, tests/core/, tests/ask/]
    human_gate: false
    review_focus: "a pure refactor: validator decisions and executor results unchanged (locked G5b still passes); the adapter is the only warehouse path in executor and validator; governor's own stores untouched; error names unchanged"
  - id: C3
    title: Postgres test bed with the Olist loader and a synthetic sample
    tier: mechanical
    prompt: plan/prompts/C3.md
    accept: plan/accept/accept_c3.py
    allowed_paths: [testbed/, tests/testbed/, .gitignore, pyproject.toml, uv.lock]
    human_gate: false
    review_focus: "headers exactly as published (including product_name_lenght); loader transactional and idempotent; sample clearly synthetic with every edge case; no real data committed; licence left as a marked TODO"
  - id: C4
    title: Postgres adapter and database roles
    tier: design
    prompt: plan/prompts/C4.md
    accept: plan/accept/accept_c4.py
    allowed_paths: [src/governor/core/adapters/, src/governor/core/config.py, testbed/sql/, testbed/apply_roles.py, testbed/docker-compose.yml, testbed/README.md, tests/core/, tests/testbed/, pyproject.toml, uv.lock]
    human_gate: true
    review_focus: "read-only and timeout enforced by the database, not only by the app; SET ROLE only from allowed_roles and never from SQL text; no passwords in files beyond the documented test-bed defaults; governor_build limited to dev_governor"
  - id: C5
    title: Serving schemas and the validator in the Postgres dialect
    tier: design
    prompt: plan/prompts/C5.md
    accept: plan/accept/accept_c5.py
    allowed_paths: [src/governor/core/serving.py, src/governor/ask/validator.py, src/governor/ask/policy.py, testbed/sql/, testbed/README.md, tests/testbed/, tests/ask/, tests/fixtures/]
    human_gate: true
    review_focus: "the salt never appears in a view definition or a log; hashing keeps equality and COUNT(DISTINCT); masks follow grants; each reader role sees only its own schema; nothing written under knowledge/"
  - id: C6
    title: KPI catalogue, layer blueprint and approved-decisions formats
    tier: design
    prompt: plan/prompts/C6.md
    accept: plan/accept/accept_c6.py
    allowed_paths: [src/governor/core/catalogue.py, knowledge/blueprint.md, knowledge/kpis.yaml, knowledge/approved.yaml, tests/core/]
    human_gate: true
    review_focus: "formats match design sections 6-8; validation errors name the KPI; render can neither leave nor add placeholders; no KPI definitions invented; blueprint wording is plain and matches the agreed rules L1-L9"
